[package]
name = "tic80_rust"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite subset of TIC-80: framebuffer, Lua bridge, memory, audio capture + FFT/VQT"
license = "MIT"
repository = "https://github.com/nesbox/TIC-80"
readme = "../README.md"
keywords = ["tic-80", "fantasy-console", "game", "graphics", "audio"]
categories = ["game-engines", "graphics", "multimedia::audio"]

[dependencies]
winit = "0.28"
pixels = "0.14"
mlua = { version = "0.9", features = ["lua53", "vendored"] }
cpal = "0.15"
rtrb = "0.3"
parking_lot = "0.12"
anyhow = "1"
realfft = "3"
